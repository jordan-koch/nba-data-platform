[project]
name = "nba-platform"
version = "0.1.0"
description = "An NBA lakehouse — extraction, medallion transformation, and analytics serving"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jordan Koch" }]
dependencies = []

# Runtime dependencies stay empty until a feature request needs one. Extraction
# (nba_api, httpx) arrives with the source that requires it — see
# requests/feature-requests/README.md.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]
transform = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.0",
    "sqlfluff>=3.1",
    "sqlfluff-templater-dbt>=3.1",
]

[tool.uv]
default-groups = ["dev", "transform"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_platform"]

# ─── Lint & format ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetimes — every timestamp here is tz-aware or it is a bug
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",     # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ─── Types ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# ─── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "network: hits a live external API. Excluded from CI; run explicitly with -m network.",
]
